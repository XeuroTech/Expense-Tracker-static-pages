<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 600" width="300" height="600">
  <defs>
    <linearGradient id="cash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B6B" />
      <stop offset="100%" stop-color="#E14D4D" />
    </linearGradient>
    <linearGradient id="bank" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ECDC4" />
      <stop offset="100%" stop-color="#3BA89F" />
    </linearGradient>
    <linearGradient id="credit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFA502" />
      <stop offset="100%" stop-color="#E08E00" />
    </linearGradient>
    <linearGradient id="balanceCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E1E1E" />
      <stop offset="100%" stop-color="#242424" />
    </linearGradient>
    <linearGradient id="fab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B6B" />
      <stop offset="100%" stop-color="#4ECDC4" />
    </linearGradient>
  </defs>

  <!-- App background -->
  <rect width="300" height="600" rx="34" fill="#121212" />

  <!-- Status bar -->
  <text x="26" y="34" font-family="Inter, Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="600">9:41</text>
  <rect x="248" y="26" width="26" height="10" rx="3" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" />
  <rect x="250" y="28" width="18" height="6" rx="1.5" fill="#FFFFFF" fill-opacity="0.7" />

  <!-- Header -->
  <text x="26" y="70" font-family="Inter, Arial, sans-serif" font-size="12" fill="#A0A0A0">Good evening</text>
  <text x="26" y="92" font-family="Poppins, Inter, Arial, sans-serif" font-size="19" fill="#FFFFFF" font-weight="700">Overview</text>
  <circle cx="274" cy="80" r="16" fill="#1E1E1E" stroke="#333333" />
  <circle cx="274" cy="76" r="4.2" fill="#A0A0A0" />
  <path d="M266 90 q8 -8 16 0" stroke="#A0A0A0" stroke-width="2.2" fill="none" stroke-linecap="round" />

  <!-- Balance widget -->
  <rect x="24" y="116" width="252" height="96" rx="20" fill="url(#balanceCard)" stroke="#2C2C2C" />
  <text x="46" y="150" font-family="Inter, Arial, sans-serif" font-size="12" fill="#A0A0A0">Total Balance</text>
  <text x="46" y="182" font-family="Poppins, Inter, Arial, sans-serif" font-size="28" fill="#FFFFFF" font-weight="700">$8,240.50</text>
  <rect x="46" y="192" width="140" height="18" rx="9" fill="#25332F" />
  <path d="M56 201 l4 -6 4 6 z" fill="#4ECDC4" />
  <text x="66" y="205" font-family="Inter, Arial, sans-serif" font-size="10" fill="#4ECDC4" font-weight="600">2.4% this month</text>

  <!-- Accounts widget -->
  <text x="26" y="244" font-family="Inter, Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="600">My Wallets</text>
  <rect x="24" y="256" width="82" height="64" rx="16" fill="url(#cash)" />
  <text x="36" y="280" font-family="Inter, Arial, sans-serif" font-size="10.5" fill="#FFFFFF" fill-opacity="0.85">Cash</text>
  <text x="36" y="300" font-family="Inter, Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="700">$1,240</text>

  <rect x="115" y="256" width="82" height="64" rx="16" fill="url(#bank)" />
  <text x="127" y="280" font-family="Inter, Arial, sans-serif" font-size="10.5" fill="#FFFFFF" fill-opacity="0.85">Bank</text>
  <text x="127" y="300" font-family="Inter, Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="700">$5,600</text>

  <rect x="206" y="256" width="70" height="64" rx="16" fill="url(#credit)" />
  <text x="218" y="280" font-family="Inter, Arial, sans-serif" font-size="10.5" fill="#FFFFFF" fill-opacity="0.85">Credit</text>
  <text x="218" y="300" font-family="Inter, Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="700">$1,400</text>

  <!-- Recent transactions header -->
  <text x="26" y="350" font-family="Inter, Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="600">Recent Activity</text>
  <text x="276" y="350" font-family="Inter, Arial, sans-serif" font-size="11" fill="#FF6B6B" text-anchor="end" font-weight="600">See All</text>

  <!-- Row 1 -->
  <circle cx="40" cy="378" r="15" fill="#FF6B6B" fill-opacity="0.15" />
  <rect x="34" y="372" width="12" height="12" rx="3" fill="#FF6B6B" />
  <text x="62" y="376" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#FFFFFF">Groceries</text>
  <text x="62" y="391" font-family="Inter, Arial, sans-serif" font-size="10" fill="#A0A0A0">Today</text>
  <text x="276" y="382" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#FF4757" text-anchor="end" font-weight="600">-$45.20</text>

  <!-- Row 2 -->
  <circle cx="40" cy="424" r="15" fill="#2ECC71" fill-opacity="0.15" />
  <rect x="34" y="418" width="12" height="12" rx="3" fill="#2ECC71" />
  <text x="62" y="422" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#FFFFFF">Salary</text>
  <text x="62" y="437" font-family="Inter, Arial, sans-serif" font-size="10" fill="#A0A0A0">Yesterday</text>
  <text x="276" y="428" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#2ECC71" text-anchor="end" font-weight="600">+$3,200.00</text>

  <!-- Row 3 -->
  <circle cx="40" cy="470" r="15" fill="#FFA502" fill-opacity="0.15" />
  <rect x="34" y="464" width="12" height="12" rx="3" fill="#FFA502" />
  <text x="62" y="468" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#FFFFFF">Netflix</text>
  <text x="62" y="483" font-family="Inter, Arial, sans-serif" font-size="10" fill="#A0A0A0">Aug 2</text>
  <text x="276" y="474" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#FF4757" text-anchor="end" font-weight="600">-$15.99</text>

  <!-- Row 4 -->
  <circle cx="40" cy="516" r="15" fill="#4ECDC4" fill-opacity="0.15" />
  <rect x="34" y="510" width="12" height="12" rx="3" fill="#4ECDC4" />
  <text x="62" y="514" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#FFFFFF">Freelance</text>
  <text x="62" y="529" font-family="Inter, Arial, sans-serif" font-size="10" fill="#A0A0A0">Jul 30</text>
  <text x="276" y="520" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#2ECC71" text-anchor="end" font-weight="600">+$450.00</text>

  <!-- Bottom tab bar -->
  <rect x="0" y="546" width="300" height="54" fill="#171717" />
  <line x1="0" y1="546" x2="300" y2="546" stroke="#2C2C2C" stroke-width="1" />
  <path d="M44 565 l10 -8 10 8 v14 h-20 z" fill="none" stroke="#FF6B6B" stroke-width="2" stroke-linejoin="round" />
  <rect x="98" y="562" width="20" height="15" rx="3" fill="none" stroke="#666666" stroke-width="2" />
  <circle cx="150" cy="568" r="20" fill="url(#fab)" />
  <line x1="150" y1="560" x2="150" y2="576" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" />
  <line x1="142" y1="568" x2="158" y2="568" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" />
  <circle cx="200" cy="566" r="6" fill="none" stroke="#666666" stroke-width="2" />
  <path d="M190 580 q10 -10 20 0" stroke="#666666" stroke-width="2" fill="none" stroke-linecap="round" />
  <circle cx="252" cy="564" r="2.2" fill="#666666" />
  <circle cx="260" cy="571" r="2.2" fill="#666666" />
  <circle cx="252" cy="578" r="2.2" fill="#666666" />
</svg>
