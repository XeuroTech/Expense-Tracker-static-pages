<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="badge7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B6B" /><stop offset="100%" stop-color="#4ECDC4" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#121212" />
  <rect x="20" y="20" width="36" height="36" rx="11" fill="url(#badge7)" />
  <rect x="30" y="40" width="16" height="6" rx="2" fill="#fff" />
  <rect x="30" y="30" width="10" height="6" rx="2" fill="#fff" />
  <text x="68" y="34" font-family="Inter, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700">Budgets</text>
  <text x="68" y="50" font-family="Inter, Arial, sans-serif" font-size="10" fill="#A0A0A0">Stay within your limits</text>

  <!-- Groceries -->
  <rect x="20" y="76" width="360" height="58" rx="16" fill="#1E1E1E" stroke="#2C2C2C" />
  <text x="38" y="98" font-family="Inter, Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="600">Groceries</text>
  <text x="362" y="98" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="11" fill="#A0A0A0">$340 / $500</text>
  <rect x="38" y="108" width="324" height="10" rx="5" fill="#2C2C2C" />
  <rect x="38" y="108" width="220" height="10" rx="5" fill="#FF6B6B" />

  <!-- Entertainment -->
  <rect x="20" y="142" width="360" height="58" rx="16" fill="#1E1E1E" stroke="#2C2C2C" />
  <text x="38" y="164" font-family="Inter, Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="600">Entertainment</text>
  <text x="362" y="164" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="11" fill="#A0A0A0">$80 / $150</text>
  <rect x="38" y="174" width="324" height="10" rx="5" fill="#2C2C2C" />
  <rect x="38" y="174" width="172" height="10" rx="5" fill="#4ECDC4" />

  <!-- Transport (over budget) -->
  <rect x="20" y="208" width="360" height="58" rx="16" fill="#1E1E1E" stroke="#FF4757" />
  <text x="38" y="230" font-family="Inter, Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="600">Transport</text>
  <text x="362" y="230" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="11" fill="#FF4757" font-weight="600">$118 / $100</text>
  <rect x="38" y="240" width="324" height="10" rx="5" fill="#2C2C2C" />
  <rect x="38" y="240" width="324" height="10" rx="5" fill="#FF4757" />
  <text x="38" y="258" font-family="Inter, Arial, sans-serif" font-size="9.5" fill="#FF4757">Over budget by $18</text>

  <text x="20" y="288" font-family="Inter, Arial, sans-serif" font-size="10" fill="#A0A0A0">Total Allocated</text>
  <text x="200" y="288" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="10" fill="#FFFFFF" font-weight="600">$750.00</text>
</svg>
