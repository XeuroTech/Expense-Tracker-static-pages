<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="badgeSync" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFA502" /><stop offset="100%" stop-color="#FF6B6B" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#121212" />
  <rect x="20" y="20" width="36" height="36" rx="11" fill="url(#badgeSync)" />
  <path d="M30 42 a7 7 0 0 1 4 -13 a9 9 0 0 1 17 3 a6 6 0 0 1 -2 12 h-15 a5 5 0 0 1 -4 -2 z" fill="#fff" />
  <text x="68" y="34" font-family="Inter, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700">Cloud Sync</text>
  <text x="68" y="50" font-family="Inter, Arial, sans-serif" font-size="10" fill="#A0A0A0">Your data, on every device</text>

  <!-- Phone -->
  <rect x="46" y="100" width="70" height="120" rx="14" fill="#1E1E1E" stroke="#2C2C2C" />
  <rect x="54" y="112" width="54" height="86" rx="4" fill="#242424" />
  <circle cx="81" cy="205" r="5" fill="#333333" />
  <text x="81" y="234" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="9.5" fill="#A0A0A0">Phone</text>

  <!-- Laptop -->
  <rect x="284" y="120" width="86" height="58" rx="6" fill="#1E1E1E" stroke="#2C2C2C" />
  <rect x="290" y="126" width="74" height="46" rx="3" fill="#242424" />
  <rect x="270" y="178" width="114" height="8" rx="3" fill="#1E1E1E" stroke="#2C2C2C" />
  <text x="327" y="202" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="9.5" fill="#A0A0A0">Laptop</text>

  <!-- Cloud in the middle with sync arrows -->
  <path d="M170 150 a18 18 0 0 1 5 -35 a24 24 0 0 1 46 -6 a16 16 0 0 1 4 31 z" fill="url(#badgeSync)" />
  <path d="M190 132 l-8 8 8 8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M212 132 l8 8 -8 8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />

  <rect x="120" y="240" width="160" height="26" rx="13" fill="#123A2A" />
  <circle cx="140" cy="253" r="5" fill="#2ECC71" />
  <text x="152" y="257" font-family="Inter, Arial, sans-serif" font-size="10.5" fill="#2ECC71" font-weight="600">Synced just now</text>
</svg>
